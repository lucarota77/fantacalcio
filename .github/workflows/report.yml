name: Report fantacalcio

on:
  schedule:
    # GitHub Actions usa sempre UTC e non conosce l'ora legale. Si fira ogni ora fra le 11:00
    # e le 19:00 UTC — finestra che copre le 14:00-20:00 italiane sia con l'ora legale (UTC+2)
    # sia con quella solare (UTC+1) — e lo step successivo tiene solo le esecuzioni in cui a
    # Roma l'ora e fra le 14 e le 20. Cosi la finestra vale tutto l'anno senza manutenzione.
    - cron: '0 11-19 * * 5'
  workflow_dispatch:        # esecuzione a richiesta, anche via API (IFTTT, Shortcut, curl)
    inputs:
      giornata:
        description: 'Numero di giornata (vuoto = dedotto dai report gia presenti)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Esegui solo nella finestra 14-20 ora di Roma
        id: ora
        run: |
          H=$(TZ=Europe/Rome date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "esegui=si" >> $GITHUB_OUTPUT
            echo "Esecuzione manuale: procedo."
          elif [ "$H" -ge 14 ] && [ "$H" -le 20 ]; then
            echo "esegui=si" >> $GITHUB_OUTPUT
            echo "A Roma sono le $H, dentro la finestra 14-20: procedo."
          else
            echo "esegui=no" >> $GITHUB_OUTPUT
            echo "A Roma sono le $H, fuori dalla finestra 14-20: salto."
          fi

      - uses: actions/checkout@v4
        if: steps.ora.outputs.esegui == 'si'

      - uses: actions/setup-python@v5
        if: steps.ora.outputs.esegui == 'si'
        with: { python-version: '3.11' }

      - name: Probabili formazioni (Gazzetta + fantacalcio.it)
        if: steps.ora.outputs.esegui == 'si'
        run: |
          python3 raccolta_cloud.py gazzetta > gz.txt
          python3 parse_gazzetta.py gz.txt rosa.json > gz.json
          python3 parse_fantacalcio.py - rosa.json > fc.json
          python3 -c "import json;[print(f'{n}: '+str(sum(1 for v in json.load(open(f)).values() if v.get(k) is not None))+'/25') for n,f,k in [('gazzetta','gz.json','gz'),('fantacalcio','fc.json','fc')]]"

      - name: Statistiche stagionali (MV e FM)
        if: steps.ora.outputs.esegui == 'si'
        run: |
          python3 parse_statistiche.py rosa.json > statistiche.json
          python3 -c "import json;d=json.load(open('statistiche.json'));print('con MV:',sum(1 for v in d.values() if v.get('mv')),'/',len(d))"

      - name: Quote
        if: steps.ora.outputs.esegui == 'si'
        continue-on-error: true      # una fonte che sbaglia un colpo non deve abbattere il report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 raccolta_cloud.py dati || echo '{"matches":[]}' > dati_cloud.json
          # I mercati per giocatore non sono raggiungibili da qui: si riusano quelli
          # dell'ultima passata locale, se sono della stessa giornata (quote_cache.json).
          if [ -f quote_cache.json ]; then
            python3 -c "import json;c=json.load(open('quote_cache.json'));print('cache quote: giornata',c['giornata'],'rilevate',c['rilevate'],'—',len(c['quote']),'giocatori')"
          else
            echo "nessuna cache quote: i mercati per giocatore resteranno n.d."
          fi

      - name: Calcolo
        if: steps.ora.outputs.esegui == 'si'
        run: |
          set -e
          GIORNATA="${{ inputs.giornata }}" python3 componi.py
          python3 calcola.py dati.json
          python3 giocatori.py
          # La giornata si legge dai dati (Gazzetta la scrive in testa), non contando i
          # file di report: contarli sbaglia a ogni rilancio nella stessa giornata.
          N="${{ inputs.giornata }}"
          if [ -z "$N" ]; then N=$(python3 raccolta_cloud.py giornata < /dev/null || true); fi
          if [ -z "$N" ]; then
            N=$(ls report/*.md 2>/dev/null | sed -n 's/.*giornata\([0-9]*\)\.md/\1/p' | sort -n | tail -1)
            N=${N:-1}
            echo "giornata non leggibile dai dati: riuso l'ultima presente ($N)"
          fi
          echo "giornata: $N"
          echo "GIORNATA=$N" >> $GITHUB_ENV
          TS=$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')
          D=$(TZ=Europe/Rome date '+%Y-%m-%d')
          python3 report.py "$N" "$TS" "report/$D-giornata$N.md"
          python3 genera_html.py "$N" "$TS" pagina.html
          python3 pubblica_pages.py pagina.html docs/index.html

      - name: Pubblica
        if: steps.ora.outputs.esegui == 'si'
        run: |
          rm -f gz.txt pagina.html
          git config user.name  "Report Fantacalcio"
          git config user.email "action@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            PARZIALE=$(grep -c 'class="banner"' docs/index.html || true)
            [ "$PARZIALE" -gt 0 ] && TAG="parziale" || TAG="completo"
            git commit -m "Giornata $GIORNATA — report automatico ($TAG)"
            git push
            echo "Pubblicato: https://lucarota77.github.io/fantacalcio/"
          fi
